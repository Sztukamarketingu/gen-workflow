services:
  web:
    image: ghcr.io/sztukamarketingu/gen-workflow:latest
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n-generator.rule=Host(`gen-workflow.aikuznia.cloud`)
      - traefik.http.routers.n8n-generator.entrypoints=websecure
      - traefik.http.routers.n8n-generator.tls=true
      - traefik.http.routers.n8n-generator.tls.certresolver=mytlschallenge
      - traefik.http.services.n8n-generator.loadbalancer.server.port=80
      - traefik.docker.network=root_default
    networks:
      - root_default

networks:
  root_default:
    external: true
